name: netbsd-i386
on:
  push:
    branches: [netbsd-fixes-2-ci]
concurrency:
  group: netbsd-i386-${{ github.ref }}
  cancel-in-progress: true
jobs:
  i386:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: qemu and KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM" || echo "::warning::no KVM"
      - name: Configure, build and test on NetBSD/i386
        run: sh .github/ci/netbsd-i386.sh 44c044c0bd b1c4a83846
      - name: console
        if: failure()
        run: tail -80 .vm/i386-11.0.console.log 2>/dev/null || true
